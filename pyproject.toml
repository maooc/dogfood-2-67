[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envsync"
version = "0.1.0"
description = "Multi-environment configuration file management CLI tool"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "envsync", email = "envsync@example.com" }
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
    "pyyaml>=6.0",
    "toml>=0.10.2",
    "deepdiff>=6.0.0",
    "jinja2>=3.0.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
envsync = "envsync.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["envsync"]
